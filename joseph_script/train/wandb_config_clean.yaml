# 干净的训练配置（供 wandb sync --config 使用）
# 精选关键参数，避免把 dataset/model 内部杂乱参数带进 WandB
loss:
  train_criterion: "ConfAndExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, compute_absolute_pose_loss=True, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, apply_normal_and_gm_loss_to_synthetic_data_only=True, cam_frame_points_loss_weight=0.1, depth_loss_weight=0.1, ray_directions_loss_weight=0.1, pose_quats_loss_weight=0.1, pose_trans_loss_weight=0.1, scale_loss_weight=0.1, world_frame_points_loss_weight=1, normal_loss_weight=0.3, gm_loss_weight=0.3), conf_alpha=0.2, top_n_percent=5, apply_to_real_data_only=True) + 0.03 * NonAmbiguousMaskLoss(BCELoss())"
  test_criterion: "ExcludeTopNPercentPixelLoss(FactoredGeometryScaleRegr3DPlusNormalGMLoss(RobustRegressionLoss(alpha=0.5, scaling_c=0.05), norm_mode='avg_dis', depth_type_for_loss='depth_along_ray', loss_in_log=True, compute_absolute_pose_loss=True, compute_pairwise_relative_pose_loss=True, compute_world_frame_points_loss=True, apply_normal_and_gm_loss_to_synthetic_data_only=True, cam_frame_points_loss_weight=0.1, depth_loss_weight=0.1, ray_directions_loss_weight=0.1, pose_quats_loss_weight=0.1, pose_trans_loss_weight=0.1, scale_loss_weight=0.1, world_frame_points_loss_weight=1, normal_loss_weight=0.3, gm_loss_weight=0.3), top_n_percent=5, apply_to_real_data_only=True) + 0.03 * NonAmbiguousMaskLoss(BCELoss())"
train_params:
  lr: 0.0001
  min_lr: 0.000001
  epochs: 50
  warmup_epochs: 2
  weight_decay: 0.05
  schedule_type: linear_warmup_half_cycle_cosine_decay
  accum_iter: 1
  amp: true
  amp_dtype: bf16
  print_freq: 20
  save_freq: 1
  keep_freq: 5
  eval_freq: 1
  resume: true
submodule:
  encoder:
    lr: 0.000005
    min_lr: 0.00000005
    warmup_epochs: 2
    weight_decay: 0.05
    schedule_type: linear_warmup_half_cycle_cosine_decay
batch:
  max_num_of_imgs_per_gpu: 8
  effective_batch_size: 4.0
model:
  model_str: mapanything
  encoder_name: dinov2_giant_24_layers
  pretrained: /mnt/workspace/yangyulong/code/mapanything/map-anything-main/checkpoints/map-anything.pth
optimizer: AdamW (betas=(0.9, 0.95))
